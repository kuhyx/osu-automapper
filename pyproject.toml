[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-automapper"
version = "0.1.0"
description = "Reproducible generation and deterministic quality gates for AI-generated osu! beatmaps."
requires-python = ">=3.14"
# No slider: parse.py is hand-rolled so it can REPORT malformed model output
# instead of raising on it. rosu-pp-py provides star ratings without osu-tools.
dependencies = ["rosu-pp-py==4.0.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "mypy==2.3.1", "ruff==0.16.5"]

[project.scripts]
osu-automapper = "osu_automapper.cli:main"

[tool.setuptools.packages.find]
include = ["osu_automapper*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "PTH", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
addopts = "--cov=osu_automapper --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
# `python -m osu_automapper` exits the interpreter by design, so it can only be
# exercised in a subprocess, where coverage cannot trace it. The module is three
# lines that delegate to cli.main(), which is itself fully covered.
omit = ["osu_automapper/__main__.py"]
